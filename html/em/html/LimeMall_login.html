<!DOCTYPE html>
<!-- LimeMall_login -->
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:url" content="http://www.oioioq.com">
        <meta property="og:title" content="oioioq :: PORTFOLIO">
        <meta property="og:type" content="website">
        <meta property="og:image" content="http://www.oioioq.com/resources/images/metaImg.webp">
        <meta property="og:description" content="WEB DESIGN & PUBLISHING PORTFOLIO">

        <link rel="icon" type="image/x-icon" href="../../../resources/images/favicon.svg" />
        <link rel="stylesheet" type="text/css" href="../resources/css/package.css" />

        <title>oioioq :: Employee Mall</title>
    </head>
    <body>
        <!-- wrap -->
        <div class="wrap login">
            <!-- content -->
            <div class="content">
                <!-- box -->
                <div class="box">
                    <!-- box -->
                    <div class="box">
                        <!-- logo -->
                        <div class="logo">
                            <p><img src="../resources/images/logo.svg" alt="LIME MALL" /></p>
                            <h1>EMPLOYEE MALL</h1>
                        </div>
                        <!-- // logo -->
                        <!-- form -->
                        <form class="form">
                            <label>
                                <input class="input" type="text" placeholder="아이디 입력" />
                            </label>
                            <label>
                                <input class="input" type="password" placeholder="비밀번호 입력" />
                            </label>
                            <label>
                                <input class="cb" type="checkbox" />
                                <span class="no_drag">아이디 기억하기</span>
                            </label>
                        </form>
                        <!-- // form -->
                        <!-- btn -->
                        <button class="btn" onclick="location.href='./LimeMall_main_001.html'">로그인</button>
                        <!-- // btn -->
                    </div>
                    <!-- // box -->
                </div>
                <!-- // box -->
            </div>
            <!-- // content -->
        </div>
        <!-- // wrap -->

        <!-- script -->
        <script src="../resources/js/jquery.min.js"></script>
        <script src="../resources/js/publish.js"></script>
        <!-- // script -->
    </body>
</html>
