<!DOCTYPE html>
<!-- index.html -->
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="oioioq :: GSAP 테스트 프로젝트">
        <meta property="og:url" content="http://www.oioioq.com">
        <meta property="og:title" content="oioioq :: PORTFOLIO">
        <meta property="og:type" content="website">
        <meta property="og:image" content="http://www.oioioq.com/resources/images/metaImg.webp">
        <meta property="og:description" content="WEB DESIGN & PUBLISHING PORTFOLIO">

        <link rel="icon" type="image/x-icon" href="./resources/images/favicon.webp">
        <link rel="stylesheet" href="./resources/css/package.css">

        <title>oioioq :: GSAP</title>
    </head>

    <body>
        <div class="parallax__progress">
            <progress max="100" value="0"></progress>
        </div>

        <main id="parallax__cont">
            <section id="section1" class="parallax__item">
                <span class="parallax__item__num">01</span>
                <figure class="parallax__item__imgWrap">
                    <div class="parallax__item__img"></div>
                </figure>
                <p class="parallax__item__desc reveal">말은 사람의 입에서 태어났다가 사람의 귀에서 죽는다.</p>
            </section>
    
            <section id="section2" class="parallax__item">
                <span class="parallax__item__num">02</span>
                <figure class="parallax__item__imgWrap reveal reveal_LTR">
                    <div class="parallax__item__img"></div>
                </figure>
                <p class="parallax__item__desc reveal reveal_LTR" data-delay="0.5">
                    하지만 어떤 말들은<br>
                    죽지 않고 사람의 마음 속으로 들어가 살아 남는다.</p>
            </section>
    
            <section id="section3" class="parallax__item">
                <span class="parallax__item__num">03</span>
                <figure class="parallax__item__imgWrap reveal reveal_TTB">
                    <div class="parallax__item__img"></div>
                </figure>
                <p class="parallax__item__desc reveal reveal_BTT" data-delay="0.5">
                    어떤 말을 두렵고, 어떤 말은 반갑고,<br>
                    어떤 말은 여전히 아플 것이며
                </p>
            </section>
    
            <section id="section4" class="parallax__item">
                <span class="parallax__item__num">04</span>
                <figure class="parallax__item__imgWrap">
                    <div class="parallax__item__img"></div>
                </figure>
                <p class="parallax__item__desc reveal reveal_LTR">
                    또 어떤 말은 설렘으로,<br>
                    남아 있을 것이다.
                </p>
            </section>
    
            <section id="section5" class="parallax__item">
                <span class="parallax__item__num">05</span>
                <figure class="parallax__item__imgWrap">
                    <div class="parallax__item__img"></div>
                </figure>
                <p class="parallax__item__desc reveal reveal_TTB">- 운다고 달라지는 일은 아무것도 없겠지만, 박준</p>
            </section>
        </main>

        <!-- script -->
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollToPlugin.min.js"></script>
        <script src="./resources/js/publish.js"></script>
        <!-- // script -->
    </body>
</html>
