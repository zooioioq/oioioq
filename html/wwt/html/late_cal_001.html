        <script>
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                headerToolbar: {
                    left: 'prev',
                    center: 'title',
                    right: 'next'
                },
                eventLimit : true,
                eventTimeFormat: { // like '14:30:00'
                    hour: '2-digit',
                    minute: '2-digit',
                    meridiem: false,
                    hour12: false,
                },
                events: [
                    {
                        start: '2023-06-06T09:00:00',
                        end: '2023-06-07T18:30:00'
                    },
                    {
                        start: '2023-06-06',
                        end: '2023-06-06'
                    },

                        end: '2023-06-15'
                    },
                    {
                        start: '2023-06-28',
                        end: '2023-06-28'
                    }

                locale: 'ko'
            });
            calendar.render();
