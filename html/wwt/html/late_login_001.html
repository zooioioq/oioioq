<!DOCTYPE html>
<!-- late_login_001.html -->
<html lang="kr">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:url" content="http://www.oioioq.com">
        <meta property="og:title" content="oioioq :: PORTFOLIO">
        <meta property="og:type" content="website">
        <meta property="og:image" content="http://www.oioioq.com/resources/images/metaImg.webp">
        <meta property="og:description" content="WEB DESIGN & PUBLISHING PORTFOLIO">

        <link rel="icon" type="image/x-icon" href="../../../resources/images/favicon.svg">
        <link rel="stylesheet" href="../resources/css/package.css" />

        <title>oioioq :: We Work Together</title>
    </head>
    <body>
        <!-- wrap -->
        <div class="wrap login_wrap">
            <!-- container -->
            <div class="container">
                <!-- logo_wrap -->
                <div class="logo_wrap">
                    <p class="logo"></p>
                </div>
                <!-- // logo_wrap -->
                <div class="content">
                    <!-- login_content -->
                    <div class="login_content">
                        <!-- form_login -->
                        <form class="form form_login">
                            <!-- input_box -->
                            <div class="input_box">    
                                <div class="select_box">
                                    <select class="select">
                                        <option>지자체 선택</option>
                                        <option>지자체1</option>
                                        <option>지자체2</option>
                                    </select>
                                </div>
                                <div>
                                    <input type="text" class="input" placeholder="ID">
                                </div>
                                <div>
                                    <input type="password" class="input" placeholder="PW">
                                </div>
                            </div>
                            <!-- // input_box -->
                            <div class="login_cndtn">
                                <div class="cb_wrap">
                                    <label for="login_remember_chk" class="cb_label">
                                        <input id="login_remember_chk" class="" type="checkbox">
                                        <span class="cb"></span>
                                        로그인 상태 유지
                                    </label>
                                </div>
                                <div class="find_id">
                                    <button type="button">ID / PW 찾기</button>
                                </div>
                            </div>
                        </form>
                        <!-- // form_login -->
                        <!-- btn_wrap -->
                        <div class="btn_wrap login_btn_wrap">
                            <button class="btn btn_ok" onclick="location.href='./late_chat_001.html'">로그인</button>
                        </div>
                        <!-- // btn_wrap -->
                        <!-- sign_in -->
                        <div class="sign_in">
                            <button type="button">처음 오신 분은 이곳을 눌러주세요!</button>
                        </div>
                        <!-- // sign_in -->
                    </div>
                </div>
                <!-- // login_content -->
                <!-- login_footer -->
                <div class="login_footer">
                    <button type="button">언어설정</button>
                    <button type="button">이용약관</button>
                    <button type="button">고객센터</button>
                </div>
                <!-- // login_footer -->
            </div>
            <!-- // container -->
        </div>
        <!-- // wrap -->

        <!-- script -->
        <script src="../resources/js/jquery.min.js"></script>
        <script src="../resources/js/jquery-ui.min.js"></script>
        <script src="../resources/js/html5shiv.min.js"></script>
        <script src="../resources/js/publish.js"></script>
        <!-- // script -->
    </body>
</html>
